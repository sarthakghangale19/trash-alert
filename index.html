<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrashAlert — Report Garbage, Get It Fixed</title>
<meta name="description" content="TrashAlert is a community garbage complaint reporting portal." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗑️</text></svg>" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* ============================= THEME / BASE ============================= */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface-2:#f8fafc;
  --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --primary:#16a34a; --primary-dark:#15803d; --primary-soft:#dcfce7;
  --danger:#dc2626; --danger-soft:#fee2e2;
  --warn:#d97706; --warn-soft:#fef3c7;
  --info:#2563eb; --info-soft:#dbeafe;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 10px 30px -18px rgba(15,23,42,.35);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 4px 12px -8px rgba(15,23,42,.3);
}
[data-theme="dark"]{
  --bg:#0a1120; --surface:#111a2e; --surface-2:#0e1729;
  --text:#e6edf7; --muted:#93a3bb; --border:#22304d;
  --primary:#22c55e; --primary-dark:#16a34a; --primary-soft:#0d2b1a;
  --danger:#f87171; --danger-soft:#3a1414;
  --warn:#fbbf24; --warn-soft:#3a2a0a;
  --info:#60a5fa; --info-soft:#11243f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}
a{color:inherit; text-decoration:none}
h1,h2,h3,h4{line-height:1.25; margin:0 0 .5rem}
h1{font-size:clamp(1.6rem,3.5vw,2.3rem); letter-spacing:-.02em}
h2{font-size:clamp(1.25rem,2.4vw,1.6rem); letter-spacing:-.01em}
p{margin:0 0 .8rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.center{text-align:center}
.view{flex:1; width:100%; max-width:1180px; margin:0 auto; padding:26px 18px 60px}

/* ============================= NAV ============================= */
.nav{
  position:sticky; top:0; z-index:900; background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1180px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:9px; font-size:1.12rem; font-weight:600; letter-spacing:-.02em}
.brand-mark{font-size:1.4rem}
.brand-text strong{color:var(--primary)}
.brand.small{font-size:1rem}
.nav-links{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-left:auto}
.nav-links a{padding:7px 12px; border-radius:999px; color:var(--muted); font-weight:500; font-size:.92rem; transition:.15s}
.nav-links a:hover{background:var(--surface-2); color:var(--text)}
.nav-links a.active{background:var(--primary-soft); color:var(--primary-dark)}
[data-theme="dark"] .nav-links a.active{color:var(--primary)}
.nav-user{display:flex; flex-direction:column; line-height:1.15; padding:0 8px; font-size:.85rem; font-weight:600}
.nav-user small{color:var(--muted); font-weight:500; text-transform:capitalize; font-size:.72rem}
.nav-toggle{display:none; background:none; border:1px solid var(--border); color:var(--text); border-radius:9px; font-size:1.1rem; padding:5px 11px; cursor:pointer; margin-left:auto}
@media(max-width:760px){
  .nav-toggle{display:block}
  .nav-links{display:none; width:100%; flex-direction:column; align-items:stretch; margin:8px 0 4px}
  .nav-links.open{display:flex}
  .nav-links a{padding:10px 12px}
  .nav-user{padding:8px 12px}
}

/* ============================= BUTTONS / FORM ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 17px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text); font:inherit; font-weight:600; font-size:.92rem;
  cursor:pointer; transition:.15s; text-align:center;
}
.btn:hover{border-color:color-mix(in srgb, var(--muted) 45%, transparent); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
.btn.primary:hover{background:var(--primary-dark); border-color:var(--primary-dark)}
.btn.danger{background:var(--danger); border-color:var(--danger); color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px; font-size:.83rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.55; cursor:not-allowed; transform:none}
input,select,textarea{
  width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text); font:inherit; font-size:.94rem; transition:.15s;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
textarea{resize:vertical; min-height:110px}
label{display:block; font-weight:600; font-size:.86rem; margin-bottom:14px}
label > span{display:block; margin-bottom:6px; color:var(--text)}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:0 16px}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}}
fieldset{border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin:0 0 18px}
legend{font-weight:700; padding:0 8px; font-size:.9rem; color:var(--primary-dark)}
[data-theme="dark"] legend{color:var(--primary)}

/* ============================= CARDS / LAYOUT ============================= */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm)}
.card + .card{margin-top:16px}
.stack > * + *{margin-top:14px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin:34px 0 14px; flex-wrap:wrap}
.section-head h2{margin:0}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px}

/* ============================= HERO ============================= */
.hero{
  background:linear-gradient(135deg,var(--primary) 0%, #0d9488 100%);
  color:#fff; border-radius:22px; padding:clamp(26px,5vw,52px); position:relative; overflow:hidden;
  box-shadow:0 24px 60px -30px rgba(13,148,136,.9);
}
.hero::after{content:"🗑️"; position:absolute; right:-10px; bottom:-38px; font-size:11rem; opacity:.13; transform:rotate(-12deg)}
.hero h1{color:#fff; max-width:640px}
.hero p{max-width:560px; opacity:.94; font-size:1.03rem}
.hero .btn{background:#fff; color:var(--primary-dark); border-color:#fff}
.hero .btn.ghost{background:rgba(255,255,255,.15); color:#fff; border-color:rgba(255,255,255,.5)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-top:26px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm)}
.stat b{display:block; font-size:1.8rem; line-height:1.1; letter-spacing:-.03em}
.stat span{color:var(--muted); font-size:.82rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em}

/* ============================= BADGES ============================= */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:.74rem; font-weight:700; letter-spacing:.02em; text-transform:uppercase}
.status-pending{background:var(--warn-soft); color:var(--warn)}
.status-in-progress{background:var(--info-soft); color:var(--info)}
.status-resolved{background:var(--primary-soft); color:var(--primary-dark)}
[data-theme="dark"] .status-resolved{color:var(--primary)}
.status-rejected{background:var(--danger-soft); color:var(--danger)}
.prio-low{background:var(--surface-2); color:var(--muted); border:1px solid var(--border)}
.prio-medium{background:var(--info-soft); color:var(--info)}
.prio-high{background:var(--warn-soft); color:var(--warn)}
.prio-urgent{background:var(--danger-soft); color:var(--danger)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.76rem; color:var(--muted); font-weight:600}

/* ============================= COMPLAINT CARD ============================= */
.complaint-card{display:flex; flex-direction:column; gap:8px; transition:.18s}
.complaint-card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.cc-head{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.cc-head .code{margin-left:auto}
.complaint-card h3{font-size:1.02rem; margin:2px 0 0}
.complaint-card h3 a:hover{color:var(--primary-dark); text-decoration:underline}
.clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:0; font-size:.9rem}
.cc-meta{display:flex; gap:12px; flex-wrap:wrap; font-size:.79rem; color:var(--muted); margin-top:auto; padding-top:8px; border-top:1px solid var(--border)}

/* ============================= FILTERS ============================= */
.filters{display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr; gap:10px; margin-bottom:20px}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.filters{grid-template-columns:1fr}}

/* ============================= MAP ============================= */
.map-box{height:420px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); z-index:1}
.map-small{height:260px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); margin-top:8px; z-index:1}
.leaflet-container{font:inherit; background:var(--surface-2)}

/* ============================= TIMELINE / COMMENTS ============================= */
.timeline{list-style:none; margin:0; padding:0 0 0 20px; border-left:2px solid var(--border)}
.timeline li{position:relative; padding:0 0 16px 12px}
.timeline li::before{content:""; position:absolute; left:-27px; top:6px; width:11px; height:11px; border-radius:50%; background:var(--primary); border:2px solid var(--surface)}
.timeline time{display:block; font-size:.76rem; color:var(--muted)}
.comment{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px}
.comment + .comment{margin-top:10px}
.comment header{display:flex; justify-content:space-between; gap:10px; font-size:.82rem; font-weight:700; margin-bottom:4px}
.comment p{margin:0; font-size:.92rem}
.comment .role{font-weight:600; color:var(--primary-dark); font-size:.72rem; text-transform:uppercase; margin-left:6px}
[data-theme="dark"] .comment .role{color:var(--primary)}

/* ============================= TABLE ============================= */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:.88rem; min-width:720px}
th,td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--border); vertical-align:middle}
th{background:var(--surface-2); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td select{padding:5px 8px; font-size:.82rem; min-width:120px}

/* ============================= CHART ============================= */
.chart{display:flex; align-items:flex-end; gap:6px; height:150px; padding:10px 0; border-bottom:1px solid var(--border)}
.chart .bar{flex:1; background:linear-gradient(180deg,var(--primary),#0d9488); border-radius:6px 6px 2px 2px; min-height:4px; position:relative; transition:.3s}
.chart .bar:hover{filter:brightness(1.12)}
.chart .bar span{position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:.68rem; color:var(--muted); font-weight:700}
.chart-labels{display:flex; gap:6px; margin-top:6px}
.chart-labels div{flex:1; text-align:center; font-size:.62rem; color:var(--muted); writing-mode:vertical-rl; transform:rotate(180deg); height:44px}

/* ============================= TOASTS / MODAL ============================= */
.toasts{position:fixed; right:16px; bottom:16px; z-index:2000; display:flex; flex-direction:column; gap:10px; max-width:340px}
.toast{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--info); border-radius:var(--radius-sm); padding:12px 15px; box-shadow:var(--shadow); font-size:.88rem; animation:slideIn .25s ease}
.toast.success{border-left-color:var(--primary)}
.toast.error{border-left-color:var(--danger)}
@keyframes slideIn{from{opacity:0; transform:translateX(24px)}to{opacity:1; transform:none}}
.modal{position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(3px); z-index:2100; display:flex; align-items:center; justify-content:center; padding:18px}
.modal[hidden]{display:none}
.modal-box{background:var(--surface); border-radius:var(--radius); padding:24px; max-width:420px; width:100%; box-shadow:var(--shadow); border:1px solid var(--border)}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px}

/* ============================= MISC ============================= */
.empty{text-align:center; padding:56px 20px; color:var(--muted)}
.empty .ico{font-size:3rem; display:block; margin-bottom:10px; opacity:.6}
.photo{max-width:100%; border-radius:var(--radius-sm); border:1px solid var(--border); display:block}
.detail-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:18px; align-items:start}
@media(max-width:860px){.detail-grid{grid-template-columns:1fr}}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:.89rem}
.kv dt{color:var(--muted); font-weight:600}
.kv dd{margin:0; font-weight:500}
.footer{border-top:1px solid var(--border); background:var(--surface); margin-top:40px}
.footer-inner{max-width:1180px; margin:0 auto; padding:32px 18px; display:grid; grid-template-columns:1.2fr 2fr; gap:30px}
@media(max-width:720px){.footer-inner{grid-template-columns:1fr}}
.footer-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
@media(max-width:520px){.footer-cols{grid-template-columns:1fr 1fr}}
.footer h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.footer a{display:block; font-size:.88rem; color:var(--muted); padding:3px 0}
.footer a:hover{color:var(--primary-dark)}
[data-theme="dark"] .footer a:hover{color:var(--primary)}
.footer-bottom{text-align:center; padding:14px; font-size:.8rem; color:var(--muted); border-top:1px solid var(--border)}
.how{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px}
.how .step{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm)}
.how .step b{display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--primary-soft); color:var(--primary-dark); margin-bottom:10px}
[data-theme="dark"] .how .step b{color:var(--primary)}
.how .step h4{margin:0 0 4px; font-size:.98rem}
.how .step p{margin:0; font-size:.88rem; color:var(--muted)}
.auth-wrap{max-width:440px; margin:24px auto}
.hint{background:var(--info-soft); border:1px solid color-mix(in srgb,var(--info) 35%,transparent); color:var(--text); border-radius:var(--radius-sm); padding:12px 14px; font-size:.85rem; margin-bottom:16px}
.hint code{background:rgba(0,0,0,.07); padding:1px 6px; border-radius:5px; font-size:.85em}
[data-theme="dark"] .hint code{background:rgba(255,255,255,.12)}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#/home"><span class="brand-mark">🗑️</span><span class="brand-text">Trash<strong>Alert</strong></span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="navLinks"></nav>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <div class="brand small"><span class="brand-mark">🗑️</span><span class="brand-text">Trash<strong>Alert</strong></span></div>
      <p class="muted small">A cleaner neighbourhood starts with one report.</p>
    </div>
    <div class="footer-cols">
      <div><h4>Portal</h4>
        <a href="#/report">Report an issue</a>
        <a href="#/complaints">Browse reports</a>

      </div>
      <div><h4>Account</h4>

        <a href="#/admin">Staff dashboard</a>
      </div>
    </div>
  </div>
  <div class="footer-bottom">© <span id="year"></span> TrashAlert · Built for cleaner cities.</div>

<div id="toasts" class="toasts"></div>
<div id="modal" class="modal" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   TRASHALERT — single-file app
   "Backend"  : the `api` object below (async, validates, mutates DB)
   "Database" : localStorage (see DB object). Swap with real REST calls
                and a server DB when you move to production.
   ===================================================================== */

/* ------------------------------ constants ------------------------------ */
const DB_KEY      = 'trashtalert_db_v1';
const SESSION_KEY = 'trashtalert_session_v1';
const THEME_KEY   = 'trashtalert_theme';

const CATEGORIES = ['Overflowing Bin','Illegal Dumping','Missed Pickup','Hazardous Waste','Dead Animal','Construction Debris','Other'];
const STATUSES   = ['Pending','In Progress','Resolved','Rejected'];
const PRIORITIES = ['Low','Medium','High','Urgent'];
const DEFAULT_CENTER = [12.9716, 77.5946]; // Bengaluru

/* ------------------------------ helpers ------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const delay = (ms = 130) => new Promise(r => setTimeout(r, ms));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function hash(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return ('00000000' + (h >>> 0).toString(16)).slice(-8);
}
const fmtDate = iso => new Date(iso).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s/60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60); if (h < 24) return h + 'h ago';
  const d = Math.floor(h/24); if (d < 30) return d + 'd ago';
  return new Date(iso).toLocaleDateString();
}

/* ------------------------------ toasts / modal ------------------------------ */
function toast(msg, type = 'info', ms = 3600){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(24px)'; el.style.transition = '.3s'; }, ms - 300);
  setTimeout(() => el.remove(), ms);
}
function confirmDialog(message, confirmLabel = 'Confirm'){
  return new Promise(resolve => {
    const m = $('#modal');
    m.hidden = false;
    m.innerHTML = `<div class="modal-box">
      <h3>Are you sure?</h3>
      <p class="muted">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" data-res="0">Cancel</button>
        <button class="btn danger" data-res="1">${esc(confirmLabel)}</button>
      </div></div>`;
    m.onclick = e => {
      if (e.target === m){ m.hidden = true; resolve(false); return; }
      const b = e.target.closest('[data-res]');
      if (!b) return;
      m.hidden = true;
      resolve(b.dataset.res === '1');
    };
  });
}

/* =====================================================================
   SEED DATA — runs once on first visit
   ===================================================================== */
function seed(){
  const now = Date.now(), day = 86400000;
  const mk = (name, email, role, password, daysAgo) => ({
    id: uid(), name, email, role, password: hash(password),
    createdAt: new Date(now - daysAgo * day).toISOString()
  });

  const admin = mk('Asha Rao',    'admin@trashtalert.gov', 'admin',   'admin123', 60);
  const staff = mk('Ravi Kumar',  'staff@trashtalert.gov', 'staff',   'staff123', 45);
  const demo  = mk('Demo Citizen','demo@trashtalert.gov',  'citizen', 'demo123',  20);
  const maya  = mk('Maya Iyer',   'maya@example.com',      'citizen', 'maya123',  15);

  const C = (o) => Object.assign({
    id: uid(), code: 'TA-' + Math.floor(1000 + Math.random() * 8999),
    status: 'Pending', priority: 'Medium', votes: [], comments: [], history: [],
    image: null, assignee: null, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  }, o);

  const c1 = C({

/* =====================================================================
   DATABASE LAYER (localStorage)
   ===================================================================== */
const DB = {
  data: null,
  load(){
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) this.data = JSON.parse(raw);
    } catch (e){ console.warn('DB parse failed', e); }
    if (!this.data || !Array.isArray(this.data.users) || !Array.isArray(this.data.complaints)){
      this.data = seed();
      this.save();
    }
    return this.data;
  },
  save(){
    try { localStorage.setItem(DB_KEY, JSON.stringify(this.data)); return true; }
    catch (e){
      console.error(e);
      toast('Browser storage is full. Try removing large photos.', 'error', 6000);
      return false;
    }
  },
  reset(){ localStorage.removeItem(DB_KEY); localStorage.removeItem(SESSION_KEY); this.data = seed(); this.save(); }
};

/* =====================================================================
   API LAYER (simulated backend)
   ===================================================================== */
const api = {
  /* ---- auth ---- */
  async register({ name, email, password }){
    await delay();
    name = (name || '').trim();
    email = (email || '').trim().toLowerCase();
    if (name.length < 2) throw new Error('Please enter your full name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Please enter a valid email address.');
    if ((password || '').length < 6) throw new Error('Password must be at least 6 characters.');
    if (DB.data.users.some(u => u.email.toLowerCase() === email)) throw new Error('An account with that email already exists.');
    const user = { id: uid(), name, email, password: hash(password), role: 'citizen', createdAt: new Date().toISOString() };
    DB.data.users.push(user);
    DB.save();
    localStorage.setItem(SESSION_KEY, user.id);
    return user;
  },
  async login(email, password){
    await delay();
    const u = DB.data.users.find(x => x.email.toLowerCase() === String(email || '').trim().toLowerCase());
    if (!u || u.password !== hash(String(password || ''))) throw new Error('Invalid email or password.');
    localStorage.setItem(SESSION_KEY, u.id);
    return u;
  },
  logout(){ localStorage.removeItem(SESSION_KEY); },

  /* ---- complaints ---- */
  async createComplaint(payload){
    await delay();
    const me = currentUser();
    if (!payload.title || payload.title.trim().length < 6) throw new Error('Please give a descriptive title (min 6 characters).');
    if (!payload.description || payload.description.trim().length < 15) throw new Error('Please describe the issue (min 15 characters).');
    if (!payload.address || !payload.address.trim()) throw new Error('Please provide an address or landmark.');
    if (payload.lat == null || payload.lng == null) throw new Error('Please pin the location on the map.');

    const now = new Date().toISOString();
    const c = {
      id: uid(),
      code: 'TA-' + Math.floor(1000 + Math.random() * 8999),
      title: payload.title.trim(),
      description: payload.description.trim(),
      category: CATEGORIES.includes(payload.category) ? payload.category : 'Other',
      priority: PRIORITIES.includes(payload.priority) ? payload.priority : 'Medium',
      status: 'Pending',
      address: payload.address.trim(),
      lat: payload.lat, lng: payload.lng,
      image: payload.image || null,
      createdBy: me ? me.id : null,
      createdByName: me ? me.name : 'Anonymous citizen',
      assignee: null,
      votes: [], comments: [],
      history: [{ status: 'Pending', at: now, by: me ? me.name : 'Anonymous', note: 'Report submitted' }],
      createdAt: now, updatedAt: now
    };
    DB.data.complaints.unshift(c);
    if (!DB.save()) throw new Error('Could not save — storage full.');
    return c;
  },

  async updateComplaint(id, patch){
    await delay();
    const me = requireStaff();
    const c = DB.data.complaints.find(x => x.id === id);
    if (!c) throw new Error('Complaint not found.');
    const now = new Date().toISOString();

    if (patch.status && patch.status !== c.status){
      c.status = patch.status;
      c.history.push({ status: patch.status, at: now, by: me.name, note: patch.note || 'Status updated' });
    }
    if ('assignee' in patch && patch.assignee !== c.assignee){
      c.assignee = patch.assignee || null;
      const who = patch.assignee ? (DB.data.users.find(u => u.id === patch.assignee) || {}).name : 'Unassigned';
      c.history.push({ status: c.status, at: now, by: me.name, note: 'Assignee set to ' + who });
    }
    c.updatedAt = now;
    DB.save();
    return c;
  },

  async addComment(id, text){
    await delay();
    const me = currentUser();
    if (!me) throw new Error('Please sign in to comment.');
    if (!text || !text.trim()) throw new Error('Comment cannot be empty.');
    const c = DB.data.complaints.find(x => x.id === id);
    if (!c) throw new Error('Complaint not found.');
    c.comments.push({ id: uid(), userId: me.id, name: me.name, role: me.role, text: text.trim(), createdAt: new Date().toISOString() });
    c.updatedAt = new Date().toISOString();
    DB.save();
    return c;
  },

  async toggleVote(id){
    await delay(60);
    const me = currentUser();
    if (!me) throw new Error('Please sign in to upvote.');
    const c = DB.data.complaints.find(x => x.id === id);
    if (!c) throw new Error('Complaint not found.');
    const i = c.votes.indexOf(me.id);
    if (i > -1) c.votes.splice(i, 1); else c.votes.push(me.id);
    DB.save();
    return c;
  },

  async deleteComplaint(id){
    await delay();
    const me = currentUser();
    const c = DB.data.complaints.find(x => x.id === id);
    if (!c) throw new Error('Complaint not found.');
    const isOwner = me && c.createdBy === me.id;
    const isStaff = me && (me.role === 'admin' || me.role === 'staff');
    if (!isOwner && !isStaff) throw new Error('You do not have permission to delete this report.');
    DB.data.complaints = DB.data.complaints.filter(x => x.id !== id);
    DB.save();
  },

  async updateProfile({ name }){
    await delay();
    const me = currentUser();
    if (!me) throw new Error('Not signed in.');
    if (!name || name.trim().length < 2) throw new Error('Name is too short.');
    me.name = name.trim();
    DB.save();
    return me;
  },

  async setUserRole(userId, role){
    await delay();
    const me = requireAdmin();
    if (userId === me.id) throw new Error('You cannot change your own role.');
    const u = DB.data.users.find(x => x.id === userId);
    if (!u) throw new Error('User not found.');
    u.role = role;
    DB.save();
    return u;
  }
};

/* ------------------------------ auth guards ------------------------------ */
function currentUser(){
  const id = localStorage.getItem(SESSION_KEY);
  if (!id) return null;
  return DB.data.users.find(u => u.id === id) || null;
}
function requireAuth(){
  const u = currentUser();
  if (!u){ toast('Please sign in to continue.', 'error'); location.hash = '#/login'; return null; }
  return u;
}
function requireStaff(){
  const u = requireAuth();
  if (!u) throw new Error('Authentication required.');
  if (u.role !== 'staff' && u.role !== 'admin') throw new Error('Staff access required.');
  return u;
}
function requireAdmin(){
  const u = requireAuth();
  if (!u) throw new Error('Authentication required.');
  if (u.role !== 'admin') throw new Error('Administrator access required.');
  return u;
}

let activeMaps = [];
function destroyMaps(){
  activeMaps.forEach(m => { try { m.remove(); } catch(e){} });
  activeMaps = [];
}
function hasLeaflet(){ return typeof window.L !== 'undefined'; }
const STATUS_COLORS = { 'Pending':'#d97706', 'In Progress':'#2563eb', 'Resolved':'#16a34a', 'Rejected':'#dc2626' };

function addComplaintMarkers(map, list, opts = {}){
  list.forEach(c => {
    if (c.lat == null || c.lng == null) return;
    const color = STATUS_COLORS[c.status] || '#64748b';
    L.circleMarker([c.lat, c.lng], {
      radius: 9, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1
    }).addTo(map).bindPopup(`
      <strong>${esc(c.title)}</strong><br>
      <span style="color:${color};font-weight:700">${esc(c.status)}</span> ·
      <span style="color:#64748b">${esc(c.category)}</span><br>
      <span style="color:#64748b;font-size:12px">${esc(c.address)}</span><br>
      <a href="#/complaint/${c.id}" style="font-weight:700;color:#16a34a">View full report →</a>
    `);
  });
  if (list.length){
    try { map.fitBounds(list.filter(c => c.lat != null).map(c => [c.lat, c.lng]), { padding: [40, 40], maxZoom: 14 }); }
    catch (e){ /* single point */ }
  }
}

const routes = {
  home: viewHome,
  report: viewReport,
  complaints: viewComplaints,
  map: viewMap,
  login: viewLogin,
  register: viewRegister,
  profile: viewProfile,
  admin: viewAdmin,
  about: viewAbout,
  complaint: viewComplaintDetail
};

let routeToken = 0;

async function router(){
  const token = ++routeToken;
  destroyMaps();

  const raw = location.hash.slice(1) || '/home';
  const parts = raw.split('/').filter(Boolean).map(decodeURIComponent);
  const name = (parts[0] || 'home').toLowerCase();
  const param = parts[1] || null;

  const fn = routes[name] || viewNotFound;
  const view = $('#view');

  try {
    const html = await fn(param);
    if (token !== routeToken) return;             // a newer navigation won
    view.innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  } catch (err){
    console.error(err);
    view.innerHTML = `<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(err.message)}</p>
      <a class="btn primary" href="#/home">Back to home</a></div>`;
  }

  renderNav();
  $('#navLinks').classList.remove('open');
}

function renderNav(){
  const u = currentUser();
  const raw = location.hash.slice(1) || '/home';
  const current = '/' + (raw.split('/').filter(Boolean)[0] || 'home');

  let html = '';
  const link = (href, label, key) =>
    `<a href="#${href}" class="${current === key ? 'active' : ''}">${label}</a>`;

  html += link('/home', 'Home', '/home');
  html += link('/report', 'Report', '/report');
  html += link('/complaints', 'Reports', '/complaints');
  html += link('/map', 'Map', '/map');

  if (u){
    html += link('/profile', 'My Reports', '/profile');
    if (u.role !== 'citizen') html += link('/admin', 'Dashboard', '/admin');
    html += `<span class="nav-user">${esc(u.name)}<small>${esc(u.role)}</small></span>`;
    html += `<button class="btn ghost sm" data-action="logout">Sign out</button>`;
  } else {
    html += link('/login', 'Sign in', '/login');
    html += `<a href="#/register" class="btn primary sm">Get started</a>`;
  }
  html += `<button class="btn ghost sm" data-action="theme" title="Toggle theme">🌓</button>`;

  $('#navLinks').innerHTML = html;
}

  const listEl = $('#list'); if (!listEl) return;
  const metaEl = $('#listMeta');

  const prioRank = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
  const f = complaintFilters;
  const q = f.q.trim().toLowerCase();

  let items = DB.data.complaints.filter(c => {
    if (f.status && c.status !== f.status) return false;
    if (f.category && c.category !== f.category) return false;
    if (f.priority && c.priority !== f.priority) return false;
    if (q){
      const hay = (c.title + ' ' + c.description + ' ' + c.address + ' ' + c.code + ' ' + c.category).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (f.sort === 'newest') items.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (f.sort === 'oldest') items.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
  if (f.sort === 'votes') items.sort((a,b) => b.votes.length - a.votes.length);
  if (f.sort === 'priority') items.sort((a,b) => prioRank[a.priority] - prioRank[b.priority]);

  metaEl.textContent = `${items.length} report${items.length === 1 ? '' : 's'} found`;
  listEl.innerHTML = items.length
    ? items.map(complaintCard).join('')
    : emptyState('🔍','No matching reports','Try clearing the filters or search with different keywords.','<button class="btn ghost" data-action="clear-filters">Clear filters</button>');
}

      <td>${esc(u.name)}</td>

      <td>
        ${me.role === 'admin' && u.id !== me.id
          ? `<select data-action="set-role" data-id="${u.id}">
               <option value="citizen" ${u.role === 'citizen' ? 'selected' : ''}>citizen</option>
               <option value="staff" ${u.role === 'staff' ? 'selected' : ''}>staff</option>
               <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
             </select>`
          : `<span class="badge prio-low" style="text-transform:capitalize">${esc(u.role)}</span>`}
      </td>
      <td class="muted small">${new Date(u.createdAt).toLocaleDateString()}</td>
    </tr>`).join('');

  return `
  <div class="section-head" style="margin-top:0">
    <div><h1 style="margin:0">Operations dashboard</h1><p class="muted" style="margin:4px 0 0">Signed in as ${esc(me.name)} · <span style="text-transform:capitalize">${esc(me.role)}</span></p></div>
    <button class="btn ghost sm" data-action="reset-demo">Reset demo data</button>
  </div>

  <div class="stats" style="margin-top:0">

  <div class="grid-2" style="gap:16px; margin-top:22px">

      <h3>Reports — last 14 days</h3>

          </div>

      <tbody>${rows || '<tr><td colspan="6" class="muted">No reports yet.</td></tr>'}</tbody>
    </table>
  </div>

  <div class="section-head"><h2>Users (${DB.data.users.length})</h2></div>

      <tbody>${userRows}</tbody>
    </table>
  </div>`;
}

function last14Days(){
  const out = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 13; i >= 0; i--){
    const start = new Date(today.getTime() - i * 86400000);
    const end = new Date(start.getTime() + 86400000);
    const count = DB.data.complaints.filter(c => {
      const t = new Date(c.createdAt);
      return t >= start && t < end;
    }).length;
    out.push({ label: start.toLocaleDateString(undefined, { day:'numeric', month:'short' }), count });
  }
  return out;
}

/* =====================================================================
   MAP INITIALISERS (run after the view is in the DOM)
   ===================================================================== */
function initMapsForRoute(){
  if (!hasLeaflet()) return;
  const raw = location.hash.slice(1) || '/home';
  const name = raw.split('/').filter(Boolean)[0] || 'home';

  /* --- report form picker --- */
  const pickEl = $('#pickMap');
  if (pickEl){
    const map = L.map(pickEl).setView(DEFAULT_CENTER, 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    activeMaps.push(map);

    let marker = null;
    let lat = null, lng = null;

    const setPoint = (la, ln) => {
      lat = la; lng = ln;
      if (marker) marker.setLatLng([la, ln]);
      else marker = L.marker([la, ln], { draggable: true }).addTo(map);
      marker.off('dragend').on('dragend', e => setPoint(e.target.getLatLng().lat, e.target.getLatLng().lng));
      $('#coordLabel').innerHTML = `📍 Selected: <strong>${la.toFixed(5)}, ${ln.toFixed(5)}</strong> — drag the pin to fine-tune.`;
    };

    map.on('click', e => setPoint(e.latlng.lat, e.latlng.lng));

    $('#geoBtn')?.addEventListener('click', () => {
      if (!navigator.geolocation) return toast('Geolocation is not supported by this browser.', 'error');
      toast('Locating…');
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 16);
          setPoint(latitude, longitude);
          toast('Location captured.', 'success');
        },
        () => toast('Could not get your location. Click the map instead.', 'error')
      );
    });

    // give the map a moment to size correctly
    setTimeout(() => map.invalidateSize(), 120);
  }

  /* --- detail mini map --- */
  const detailEl = $('#detailMap');
  if (detailEl){
    const id = raw.split('/').filter(Boolean)[1];
    const c = DB.data.complaints.find(x => x.id === id);
    if (c && c.lat != null){
      const map = L.map(detailEl).setView([c.lat, c.lng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      L.marker([c.lat, c.lng]).addTo(map).bindPopup(esc(c.title));
      activeMaps.push(map);
      setTimeout(() => map.invalidateSize(), 120);
    } else if (detailEl){
      detailEl.innerHTML = '<div class="empty small">No coordinates for this report.</div>';
    }
  }

  /* --- full map view --- */
  const bigEl = $('#bigMap');
  if (bigEl){
    const map = L.map(bigEl).setView(DEFAULT_CENTER, 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    activeMaps.push(map);
    addComplaintMarkers(map, DB.data.complaints);
    setTimeout(() => map.invalidateSize(), 150);
  }
}

/* ---- nav toggle ---- */
document.addEventListener('click', e => {
  if (e.target.closest('#navToggle')){
    $('#navLinks').classList.toggle('open');
  }
});

/* ---- delegated actions ---- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  try {
    if (action === 'logout'){
      api.logout();
      toast('Signed out.', 'success');
      location.hash = '#/home';
      renderNav();
    }

    if (action === 'theme'){
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem(THEME_KEY, next);
    }

    if (action === 'vote'){
      el.disabled = true;
      await api.toggleVote(id);
      await router();
      initMapsForRoute();
    }

    if (action === 'delete'){
      const ok = await confirmDialog('This report and all its comments will be permanently removed.', 'Delete report');
      if (!ok) return;
      await api.deleteComplaint(id);
      toast('Report deleted.', 'success');
      location.hash = '#/complaints';
    }

    if (action === 'clear-filters'){
      complaintFilters = { q:'', status:'', category:'', priority:'', sort:'newest' };
      await router();
      initMapsForRoute();
    }

    if (action === 'reset-demo'){
      const ok = await confirmDialog('This restores the original demo data and removes everything you added.', 'Reset data');
      if (!ok) return;
      DB.reset();
      api.logout();
      toast('Demo data restored.', 'success');
      location.hash = '#/home';
      renderNav();
    }
  } catch (err){
    toast(err.message, 'error');
  } finally {
    el.disabled = false;
  }
});

/* ---- delegated selects (admin / detail) ---- */
document.addEventListener('change', async e => {
  const el = e.target.closest('select[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;

  try {
    if (action === 'set-status'){
      await api.updateComplaint(id, { status: el.value });
      toast('Status updated to “' + el.value + '”.', 'success');
      await router();
      initMapsForRoute();
    }
    if (action === 'set-assignee'){
      await api.updateComplaint(id, { assignee: el.value || null });
      toast('Assignee updated.', 'success');
      await router();
      initMapsForRoute();
    }
    if (action === 'set-role'){
      await api.setUserRole(id, el.value);
      toast('Role updated.', 'success');
      await router();
      initMapsForRoute();
    }
  } catch (err){
    toast(err.message, 'error');
    await router();
    initMapsForRoute();
  }
});

/* ---- form submissions & live filters ---- */
document.addEventListener('submit', async e => {
  const form = e.target;
  e.preventDefault();

  /* login */
  if (form.id === 'loginForm'){
    const btn = form.querySelector('button[type=submit]');
    const original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      const u = await api.login(form.email.value, form.password.value);
      toast('Welcome back, ' + u.name + '!', 'success');
      location.hash = '#/home';
      renderNav();
    } catch (err){
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
    return;
  }

  /* register */
  if (form.id === 'registerForm'){
    const btn = form.querySelector('button[type=submit]');
    const original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      const u = await api.register({ name: form.name.value, email: form.email.value, password: form.password.value });
      toast('Account created. Welcome, ' + u.name + '!', 'success');
      location.hash = '#/home';
      renderNav();
    } catch (err){
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
    return;
  }

  /* new report */
  if (form.id === 'reportForm'){
    const btn = $('#submitBtn');
    const original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Submitting…';
    try {
      const fd = new FormData(form);
      const payload = {
        title: fd.get('title'),
        description: fd.get('description'),
        category: fd.get('category'),
        priority: fd.get('priority'),
        address: fd.get('address'),
        lat: form._lat,
        lng: form._lng,
        image: form._image || null
      };
      const c = await api.createComplaint(payload);
      toast('Report submitted — tracking ID #' + c.code, 'success', 5000);
      location.hash = '#/complaint/' + c.id;
    } catch (err){
      toast(err.message, 'error', 5000);
      btn.disabled = false;
      btn.textContent = original;
    }
    return;
  }

  /* comment */
  if (form.id === 'commentForm'){
    const id = location.hash.split('/').filter(Boolean)[1];
    const text = $('#commentText').value;
    try {
      await api.addComment(id, text);
      toast('Comment posted.', 'success');
      await router();
      initMapsForRoute();
    } catch (err){
      toast(err.message, 'error');
    }
    return;
  }

  /* profile */
  if (form.id === 'profileForm'){
    try {
      await api.updateProfile({ name: form.name.value });
      toast('Profile updated.', 'success');
      await router();
      initMapsForRoute();
    } catch (err){
      toast(err.message, 'error');
    }
    return;
  }
});

/* ---- photo picker + preview ---- */
document.addEventListener('change', async e => {
  if (e.target.id !== 'photoInput') return;
  const file = e.target.files[0];
  const preview = $('#photoPreview');
  const form = $('#reportForm');
  if (!file){ form._image = null; preview.innerHTML = ''; return; }

  if (!file.type.startsWith('image/')){ toast('Please choose an image file.', 'error'); e.target.value = ''; return; }
  if (file.size > 8 * 1024 * 1024){ toast('Image is too large (max 8 MB).', 'error'); e.target.value = ''; return; }

  try {
    const dataUrl = await compressImage(file, 900, 0.72);
    form._image = dataUrl;
    preview.innerHTML = `<img class="photo" style="max-height:220px;margin-top:6px" src="${dataUrl}" alt="Selected photo preview">
      <button type="button" class="btn ghost sm" style="margin-top:8px" id="clearPhoto">Remove photo</button>`;
    $('#clearPhoto').addEventListener('click', () => {
      form._image = null;
      preview.innerHTML = '';
      $('#photoInput').value = '';
    });
  } catch (err){
    toast('Could not read that image.', 'error');
  }
});

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > maxDim || h > maxDim){
          const s = maxDim / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
(function boot(){
  // theme
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = 'dark';

  DB.load();

  $('#year').textContent = new Date().getFullYear();

  window.addEventListener('hashchange', async () => {
    await router();
    initMapsForRoute();
  });

  // initial route
  if (!location.hash) location.hash = '#/home';
  router().then(initMapsForRoute);
})();
</script>
